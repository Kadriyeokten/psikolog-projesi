<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profilim - Fast Terapi</title>
    <link rel="shortcut icon" href="./assets/images/fast-terapi-logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script src="./assets/js/i18n.js"></script>
    <style>
      .profile-container { margin-top: 120px; padding-bottom: 60px; }
      .profile-card { background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 30px; }
      .profile-title { margin-bottom: 25px; color: var(--verdigris); border-bottom: 2px solid #eee; padding-bottom: 10px; }
      .form-group { margin-bottom: 20px; }
      .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 1.4rem; }
      .form-control { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.4rem; }
      .appointment-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      .appointment-table th, .appointment-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 1.4rem; }
      .appointment-table th { background-color: #f9f9f9; font-weight: 700; }
      .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 1.2rem; font-weight: 600; }
      .status-pending { background: #fff3cd; color: #856404; }
      .status-completed { background: #d4edda; color: #155724; }
      .status-cancelled { background: #f8d7da; color: #721c24; }
      @media (max-width: 768px) {
        .appointment-table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body id="top">
    <header class="header" data-header>
      <div class="container">
        <a href="index.html" class="logo">
          <img src="./assets/images/fast-terapi-logo.png" alt="Fast Terapi Logo" style="height: 90px" />
        </a>
        <nav class="navbar" data-navbar>
          <div class="navbar-top">
            <a
              href="index.html"
              class="logo"
              style="
                font-size: 2rem;
                font-weight: bold;
                color: var(--verdigris);
              "
            >
              <img src="./assets/images/fast-terapi-logo.png" alt="Fast Terapi Logo" style="height: 90px;">
            </a>

            <button
              class="nav-close-btn"
              aria-label="clsoe menu"
              data-nav-toggler
            >
              <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
            </button>
          </div>

          <ul class="navbar-list">
            <li class="navbar-item">
              <a href="index.html" class="navbar-link title-md" data-i18n="nav_home">Ana Sayfa</a>
            </li>

            <li class="navbar-item">
              <a href="aboutus.html" class="navbar-link title-md" data-i18n="nav_about">Hakkımızda</a>
            </li>

            <li class="navbar-item">
              <a href="service.html" class="navbar-link title-md" data-i18n="nav_services">Hizmetler</a>
            </li>

            <li class="navbar-item">
              <a href="doctors.html" class="navbar-link title-md" data-i18n="nav_doctors">Doktorlar</a>
            </li>

            <li class="navbar-item">
              <a href="conntact.html" class="navbar-link title-md" data-i18n="nav_contact">İletişim</a>
            </li>
            <li class="navbar-item">
              <a
                href="appointment.html"
                class="navbar-link title-md"
                data-i18n="nav_appointment"
                >Randevu Al</a
              >
            </li>
            <li class="navbar-item auth-item" id="loginItem">
              <a href="login.html" class="navbar-link title-md" data-i18n="nav_login">Giriş Yap</a>
            </li>

            <li class="navbar-item user-dropdown" id="userMenu" style="display: none">
              <div class="user-trigger">
                <ion-icon name="person-circle-outline" class="user-icon"></ion-icon>
                <span id="userName" class="navbar-link title-md">Kullanıcı</span>
                <ion-icon name="chevron-down-outline"></ion-icon>
              </div>
              <ul class="dropdown-list">
                <li><a href="profile.html" class="dropdown-link"><ion-icon name="person-outline"></ion-icon> <span data-i18n="nav_profile">Profilim</span></a></li>
                <li id="adminLink" style="display: none"><a href="admin.html" class="dropdown-link"><ion-icon name="settings-outline"></ion-icon> <span data-i18n="nav_admin">Admin Paneli</span></a></li>
                <li><a href="#" class="dropdown-link" id="logoutBtn"><ion-icon name="log-out-outline"></ion-icon> <span data-i18n="nav_logout">Çıkış Yap</span></a></li>
              </ul>
            </li>

            <li class="navbar-item lang-switcher">
              <button id="langToggle" class="lang-toggle-btn">
                <ion-icon name="globe-outline"></ion-icon>
                <span id="langLabel">TR</span>
              </button>
            </li>
          </ul>

          <ul class="social-list">
            <li>
              <a href="#" class="social-link">
                <ion-icon name="logo-twitter"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="social-link">
                <ion-icon name="logo-facebook"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="social-link">
                <ion-icon name="logo-pinterest"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="social-link">
                <ion-icon name="logo-instagram"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="social-link">
                <ion-icon name="logo-youtube"></ion-icon>
              </a>
            </li>
          </ul>
        </nav>
        <button class="nav-open-btn" aria-label="open menu" data-nav-toggler>
          <ion-icon name="menu-outline"></ion-icon>
        </button>
        <div class="overlay" data-nav-toggler data-overlay></div>
      </div>
    </header>

    <main>
      <a href="javascript:void(0)" onclick="if(history.length > 1) { history.back(); } else { window.location.href='index.html'; }" class="back-button" title="Geri dön">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span data-i18n="back">Geri</span>
      </a>
      <section class="profile-container">
        <div class="container">
          <div class="profile-card">
            <h2 class="headline-md profile-title">Profil Bilgilerim</h2>
            <form id="profileForm">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                  <label for="name">Ad</label>
                  <input type="text" id="name" class="form-control" required />
                </div>
                <div class="form-group">
                  <label for="surname">Soyad</label>
                  <input type="text" id="surname" class="form-control" />
                </div>
              </div>
              <div class="form-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" class="form-control" required />
              </div>
              <div class="form-group">
                <label for="phone">Telefon</label>
                <input type="text" id="phone" class="form-control" />
              </div>
              <button type="submit" class="btn has-before">Bilgileri Güncelle</button>
            </form>
          </div>

          <div class="profile-card">
            <h2 class="headline-md profile-title">Randevu Geçmişim</h2>
            <div id="appointmentsList">
              <p>Yükleniyor...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" style="background-image: url('./assets/images/footer-bg.png')">
      <div class="container">
        <div class="footer-bottom">
          <p class="text copyright">&copy; Terapist Merkezi 2026 | Tüm Hakları SESA Yazılım Tarafından Saklıdır.</p>
        </div>
      </div>
    </footer>

        }

  </body>
</html>
