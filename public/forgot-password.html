<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Terapi - Şifremi Unuttum</title>
    <link rel="shortcut icon" href="./assets/images/fast-terapi-logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script src="./assets/js/i18n.js"></script>
  </head>
  <body id="top">
    <div class="preloader" data-preloader><div class="circle"></div></div>
    <main>
      <article>
        <a href="login.html" class="back-button">
          <ion-icon name="arrow-back-outline"></ion-icon>
          <span>Giriş Sayfasına Dön</span>
        </a>
        <section class="login-container">
          <div class="login-form-wrapper">
            <h2>Şifremi Unuttum</h2>
            <p style="margin-bottom: 20px; color: #666;">Şifrenizi yenilemek için lütfen e-posta adresinizi girin. Size bir bağlantı göndereceğiz.</p>
            <form id="forgotForm">
              <div class="input-field-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required />
              </div>
              <button type="submit" class="login-btn">Bağlantı Gönder</button>
            </form>
            <div id="message" style="margin-top: 20px; text-align: center; display: none;"></div>
          </div>
        </section>
      </article>
    </main>
    <script src="./assets/js/script.js"></script>
    <script>
      const form = document.getElementById("forgotForm");
      const messageDiv = document.getElementById("message");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const btn = form.querySelector("button");
        btn.disabled = true;
        btn.textContent = "Gönderiliyor...";

        try {
          const res = await fetch("/api/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await res.json();
          messageDiv.style.display = "block";
          if (data.error) {
            messageDiv.textContent = data.error + " ❌";
            messageDiv.style.color = "red";
          } else {
            messageDiv.textContent = data.message + " ✅";
            messageDiv.style.color = "green";
            form.style.display = "none";
          }
        } catch (err) {
          console.error(err);
          alert("Sunucuya bağlanılamadı 🚨");
        } finally {
          btn.disabled = false;
          btn.textContent = "Bağlantı Gönder";
        }
      });
    </script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
