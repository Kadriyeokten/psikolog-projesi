<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast Terapi - Şifre Yenileme</title>
    <link rel="shortcut icon" href="./assets/images/fast-terapi-logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script src="./assets/js/i18n.js"></script>
  </head>
  <body id="top">
    <div class="preloader" data-preloader><div class="circle"></div></div>
    <main>
      <article>
        <section class="login-container">
          <div class="login-form-wrapper">
            <h2>Yeni Şifre Belirle</h2>
            <p style="margin-bottom: 20px; color: #666;">Lütfen yeni şifrenizi girin.</p>
            <form id="resetForm">
              <div class="input-field-group">
                <label for="password">Yeni Şifre</label>
                <input type="password" id="password" name="password" placeholder="Yeni şifrenizi girin" required minlength="6" />
              </div>
              <div class="input-field-group">
                <label for="confirmPassword">Şifre Tekrar</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Yeni şifrenizi tekrar girin" required minlength="6" />
              </div>
              <button type="submit" class="login-btn">Şifreyi Güncelle</button>
            </form>
            <div id="message" style="margin-top: 20px; text-align: center; display: none;"></div>
          </div>
        </section>
      </article>
    </main>
    <script src="./assets/js/script.js"></script>
    <script>
      const form = document.getElementById("resetForm");
      const messageDiv = document.getElementById("message");
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        alert("Geçersiz veya eksik bağlantı! Giriş sayfasına yönlendiriliyorsunuz.");
        window.location.href = "login.html";
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const newPassword = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
          alert("Şifreler uyuşmuyor! ❌");
          return;
        }

        const btn = form.querySelector("button");
        btn.disabled = true;
        btn.textContent = "Güncelleniyor...";

        try {
          const res = await fetch("/api/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword }),
          });
          const data = await res.json();
          messageDiv.style.display = "block";
          if (data.error) {
            messageDiv.textContent = data.error + " ❌";
            messageDiv.style.color = "red";
          } else {
            messageDiv.textContent = data.message + " ✅";
            messageDiv.style.color = "green";
            form.style.display = "none";
            setTimeout(() => {
              window.location.href = "login.html";
            }, 3000);
          }
        } catch (err) {
          console.error(err);
          alert("Sunucuya bağlanılamadı 🚨");
        } finally {
          btn.disabled = false;
          btn.textContent = "Şifreyi Güncelle";
        }
      });
    </script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
